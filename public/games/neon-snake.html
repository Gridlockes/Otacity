<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neon Snake — Otacity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
</head>
<body>
<script>
'use strict';
(() => {
  const COLS = 32, ROWS = 18, CELL = 25;
  let snake, dir, queue, food, bonus, stepTime, acc, grow, eaten, particles;

  function freeCell(){
    for (;;){
      const c = { x: Kit.randInt(0, COLS - 1), y: Kit.randInt(0, ROWS - 1) };
      if (!snake.some(s => s.x === c.x && s.y === c.y) && !(food && food.x === c.x && food.y === c.y)) return c;
    }
  }

  function burst(x, y, hue){
    for (let i = 0; i < 14; i++){
      const a = Math.random() * Math.PI * 2, s = Kit.rand(40, 160);
      particles.push({ x: x * CELL + CELL / 2, y: y * CELL + CELL / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, hue });
    }
  }

  Kit.run({
    slug: 'neon-snake',
    title: 'Neon Snake',
    width: COLS * CELL, height: ROWS * CELL,
    help: ['STEER WITH ARROWS / WASD / D-PAD', 'EAT THE PINK ORBS. GOLD ORBS VANISH FAST.', 'DON\'T HIT THE WALLS OR YOURSELF'],
    start(){
      snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
      dir = { x: 1, y: 0 }; queue = [];
      food = null; food = freeCell(); bonus = null;
      stepTime = 0.11; acc = 0; grow = 0; eaten = 0; particles = [];
    },
    update(dt){
      const tryDir = (x, y) => {
        const lastDir = queue.length ? queue[queue.length - 1] : dir;
        if (lastDir.x === -x && lastDir.y === -y) return;
        if (lastDir.x === x && lastDir.y === y) return;
        if (queue.length < 3) queue.push({ x, y });
      };
      if (Kit.hit('up')) tryDir(0, -1);
      if (Kit.hit('down')) tryDir(0, 1);
      if (Kit.hit('left')) tryDir(-1, 0);
      if (Kit.hit('right')) tryDir(1, 0);

      for (const p of particles){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
      particles = particles.filter(p => p.life > 0);
      if (bonus && (bonus.t -= dt) <= 0) bonus = null;

      acc += dt;
      while (acc >= stepTime){
        acc -= stepTime;
        if (queue.length) dir = queue.shift();
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const hitSelf = snake.slice(0, snake.length - (grow ? 0 : 1)).some(s => s.x === head.x && s.y === head.y);
        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || hitSelf){
          Kit.noise(.4, .15); Kit.sfx(200, .4, 'sawtooth', .08, 40);
          Kit.end('GAME OVER', `LENGTH ${snake.length}  ·  SCORE ${Kit.score}`);
          return;
        }
        snake.unshift(head);
        if (grow) grow--; else snake.pop();

        if (head.x === food.x && head.y === food.y){
          Kit.score += 10; grow += 2; eaten++;
          Kit.sfx(520 + eaten * 8, .08, 'square', .07, 900);
          burst(food.x, food.y, 330);
          food = freeCell();
          stepTime = Math.max(0.055, stepTime * 0.975);
          if (!bonus && eaten % 5 === 0){ bonus = freeCell(); bonus.t = 5; }
        }
        if (bonus && head.x === bonus.x && head.y === bonus.y){
          Kit.score += 50; grow += 4;
          Kit.sfx(880, .2, 'triangle', .09, 1760);
          burst(bonus.x, bonus.y, 48);
          bonus = null;
        }
      }
    },
    draw(c){
      c.fillStyle = '#0d0820';
      c.fillRect(0, 0, COLS * CELL, ROWS * CELL);
      c.strokeStyle = 'rgba(255,255,255,.04)';
      c.lineWidth = 1;
      for (let x = 0; x <= COLS; x++){ c.beginPath(); c.moveTo(x * CELL, 0); c.lineTo(x * CELL, ROWS * CELL); c.stroke(); }
      for (let y = 0; y <= ROWS; y++){ c.beginPath(); c.moveTo(0, y * CELL); c.lineTo(COLS * CELL, y * CELL); c.stroke(); }
      if (!snake) return;

      const t = performance.now() / 1000;
      const orb = (o, color, r) => {
        c.save();
        c.shadowColor = color; c.shadowBlur = 18;
        c.fillStyle = color;
        c.beginPath(); c.arc(o.x * CELL + CELL / 2, o.y * CELL + CELL / 2, r, 0, Math.PI * 2); c.fill();
        c.restore();
      };
      orb(food, '#ff3d81', 7 + Math.sin(t * 6) * 1.5);
      if (bonus && (bonus.t > 1.5 || Math.sin(t * 20) > 0)) orb(bonus, '#ffd23f', 9);

      c.save();
      c.shadowColor = '#34e1d6'; c.shadowBlur = 14;
      snake.forEach((s, i) => {
        const k = 1 - i / (snake.length + 6);
        c.fillStyle = `hsl(${175 - i * 2} 80% ${45 + k * 20}%)`;
        const pad = i === 0 ? 2 : 3;
        c.beginPath();
        c.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
        c.fill();
      });
      c.restore();
      // eyes
      const h = snake[0];
      c.fillStyle = '#0d0820';
      const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
      c.beginPath(); c.arc(ex - dir.y * 5, ey - dir.x * 5, 2.4, 0, 7); c.arc(ex + dir.y * 5, ey + dir.x * 5, 2.4, 0, 7); c.fill();

      for (const p of particles){
        c.globalAlpha = p.life * 2;
        c.fillStyle = `hsl(${p.hue} 100% 65%)`;
        c.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      c.globalAlpha = 1;
    },
  });
})();
</script>
</body>
</html>
