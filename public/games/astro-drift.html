<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Astro Drift — Otacity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
</head>
<body>
<script>
'use strict';
(() => {
  const W = 800, H = 450, N = 240, HALF = 44, LAPS = 3, SHIP_R = 10;
  const HUES = [330, 175, 48, 265];
  const center = Array.from({ length: N }, (_, i) => {
    const t = i / N * Math.PI * 2;
    return { x: 400 + 320 * Math.cos(t), y: 225 + 165 * Math.sin(t) + 45 * Math.sin(3 * t) };
  });
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .2 }));
  let ships, humans, clock, countdown, finished, sparks;

  function nearest(s){
    let best = s.idx, bd = Infinity;
    for (let k = -25; k <= 25; k++){
      const i = (s.idx + k + N) % N;
      const d = (center[i].x - s.x) ** 2 + (center[i].y - s.y) ** 2;
      if (d < bd){ bd = d; best = i; }
    }
    return { i: best, d: Math.sqrt(bd) };
  }
  const tangent = i => { const a = center[(i + 1) % N], b = center[(i - 1 + N) % N]; return Math.atan2(a.y - b.y, a.x - b.x); };

  const fmt = t => {
    const m = Math.floor(t / 60), s = t - m * 60;
    return `${m}:${s.toFixed(2).padStart(5, '0')}`;
  };

  Kit.run({
    slug: 'astro-drift',
    title: 'Astro Drift',
    width: W, height: H,
    best: 'low',
    bestCounts: () => humans === 1 && ships[0].done && ships[0].place === 1,
    scoreLabel: 'TIME',
    format: fmt,
    modes: ['1 PLAYER  VS 3 CPU', '2 PLAYERS', '3 PLAYERS', '4 PLAYERS'],
    players: m => m + 1,
    help: ['←/→ STEER · ↑ OR A THRUST · ↓ BRAKE', 'HOLD B TO DRIFT THROUGH CORNERS', `${LAPS} LAPS · STAY ON THE TRACK TO KEEP SPEED`, 'P1 WASD · P2 ARROWS · P3/P4 NEED GAMEPADS', 'BEST TIME COUNTS ONLY FOR SOLO WINS'],
    start(mode){
      humans = mode + 1;
      ships = HUES.map((hue, k) => {
        const idx = (N - 4 - Math.floor(k / 2) * 6) % N;
        const tan = tangent(idx);
        const side = (k % 2 ? 1 : -1) * 16;
        return {
          x: center[idx].x + Math.cos(tan + Math.PI / 2) * side,
          y: center[idx].y + Math.sin(tan + Math.PI / 2) * side,
          a: tan, vx: 0, vy: 0, idx, prog: idx - N, hue,
          human: k < humans, skill: Kit.rand(.86, .97), lane: Kit.rand(-14, 14),
          done: false, place: 0, time: 0, thrust: false,
        };
      });
      clock = 0; countdown = 3; finished = 0; sparks = [];
      Kit.score = 0;
    },
    update(dt){
      if (countdown > 0){
        const before = Math.ceil(countdown);
        countdown -= dt;
        if (Math.ceil(countdown) !== before) Kit.sfx(countdown <= 0 ? 880 : 440, .15, 'square', .07);
        return;
      }
      clock += dt;
      if (humans === 1 && !ships[0].done) Kit.score = clock;

      ships.forEach((s, k) => {
        let steer = 0, gas = false, brake = false, drift = false;
        if (s.done){ gas = false; }
        else if (s.human){
          steer = (Kit.held('right', k) ? 1 : 0) - (Kit.held('left', k) ? 1 : 0);
          gas = Kit.held('up', k) || Kit.held('a', k);
          brake = Kit.held('down', k);
          drift = Kit.held('b', k);
        } else {
          const tgt = center[(s.idx + 14) % N], tan = tangent((s.idx + 14) % N);
          const tx = tgt.x + Math.cos(tan + Math.PI / 2) * s.lane, ty = tgt.y + Math.sin(tan + Math.PI / 2) * s.lane;
          let diff = Math.atan2(ty - s.y, tx - s.x) - s.a;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          steer = Kit.clamp(diff * 3, -1, 1);
          const sp = Math.hypot(s.vx, s.vy);
          gas = sp < 330 * s.skill && Math.abs(diff) < 0.9;
          drift = Math.abs(diff) > 0.5 && sp > 200;
        }
        s.a += steer * (drift ? 4.2 : 3.4) * dt;
        s.thrust = gas;
        if (gas){ s.vx += Math.cos(s.a) * 520 * dt; s.vy += Math.sin(s.a) * 520 * dt; }

        // split velocity into forward / sideways; sideways bleeds off (grip)
        const fx = Math.cos(s.a), fy = Math.sin(s.a);
        let fwd = s.vx * fx + s.vy * fy, side = -s.vx * fy + s.vy * fx;
        const near = nearest(s);
        const off = near.d > HALF;
        side *= Math.exp(-(drift ? 1.2 : 6) * dt);
        fwd *= Math.exp(-(off ? 2.2 : brake ? 2.8 : s.done ? 1.5 : 0.35) * dt);
        const maxV = off ? 170 : 380;
        if (fwd > maxV) fwd = maxV;
        s.vx = fx * fwd - fy * side; s.vy = fy * fwd + fx * side;
        if (drift && Math.abs(side) > 60 && Math.random() < .5) sparks.push({ x: s.x, y: s.y, life: .4, hue: s.hue });

        s.x = Kit.clamp(s.x + s.vx * dt, 8, W - 8);
        s.y = Kit.clamp(s.y + s.vy * dt, 8, H - 8);

        const now = nearest(s);
        let delta = now.i - s.idx;
        if (delta > N / 2) delta -= N; if (delta < -N / 2) delta += N;
        s.prog += delta; s.idx = now.i;

        if (!s.done && s.prog >= LAPS * N){
          s.done = true; s.time = clock; s.place = ++finished;
          if (s.human) Kit.sfx(660 + (4 - s.place) * 110, .3, 'triangle', .09, 1320);
        }
      });

      // ship-to-ship bumps
      for (let i = 0; i < ships.length; i++) for (let j = i + 1; j < ships.length; j++){
        const a = ships[i], b = ships[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < SHIP_R * 2){
          const nx = dx / d, ny = dy / d, push = (SHIP_R * 2 - d) / 2;
          a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0){ a.vx += nx * rel; a.vy += ny * rel; b.vx -= nx * rel; b.vy -= ny * rel; Kit.sfx(120, .05, 'square', .04); }
        }
      }
      for (const p of sparks) p.life -= dt;
      sparks = sparks.filter(p => p.life > 0);

      const order = [...ships].sort((a, b) => (a.done && b.done) ? a.place - b.place : b.prog - a.prog);
      order.forEach((s, i) => { if (!s.done) s.pos = i + 1; else s.pos = s.place; });
      const me = ships[0];
      Kit.hud(`LAP <b>${Math.min(LAPS, Math.max(1, Math.floor(me.prog / N) + 1))}/${LAPS}</b></span><span>POS <b>${me.pos}</b>`);

      const humansDone = ships.filter(s => s.human).every(s => s.done);
      if (humansDone || clock > 300){
        const ord = ['1ST', '2ND', '3RD', '4TH'];
        if (humans === 1) Kit.end(me.done ? `${ord[me.place - 1]} PLACE` : 'TIME UP', me.done ? `TIME ${fmt(me.time)}` : '');
        else {
          const winner = ships.filter(s => s.human).sort((a, b) => a.place - b.place)[0];
          Kit.end(`PLAYER ${ships.indexOf(winner) + 1} WINS`, ships.filter(s => s.human).map((s, i) => `P${i + 1} ${ord[s.place - 1]}`).join('  ·  '));
        }
      }
    },
    draw(c){
      c.fillStyle = '#07041a'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#fff';
      for (const s of stars){ c.globalAlpha = s.r / 1.6; c.fillRect(s.x, s.y, s.r, s.r); }
      c.globalAlpha = 1;

      const path = () => { c.beginPath(); center.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); };
      c.lineJoin = 'round';
      path(); c.strokeStyle = '#ff3d81'; c.lineWidth = HALF * 2 + 6; c.stroke();
      path(); c.strokeStyle = '#1d1438'; c.lineWidth = HALF * 2; c.stroke();
      path(); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.setLineDash([10, 14]); c.stroke(); c.setLineDash([]);

      // checkered start line at index 0
      const s0 = center[0], tan = tangent(0), nx = Math.cos(tan + Math.PI / 2), ny = Math.sin(tan + Math.PI / 2);
      for (let k = -HALF; k < HALF; k += 8){
        for (let r = 0; r < 2; r++){
          c.fillStyle = ((k / 8 + r) & 1) ? '#fff' : '#111';
          c.fillRect(s0.x + nx * k - 4 + Math.cos(tan) * (r * 8 - 4), s0.y + ny * k, 8, 8);
        }
      }
      if (!ships) return;

      for (const p of sparks){
        c.globalAlpha = p.life * 2.2;
        c.fillStyle = `hsl(${p.hue} 100% 70%)`;
        c.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      c.globalAlpha = 1;

      ships.forEach((s, k) => {
        c.save();
        c.translate(s.x, s.y); c.rotate(s.a);
        if (s.thrust){
          c.fillStyle = '#ffd23f';
          c.beginPath(); c.moveTo(-8, -4); c.lineTo(-8 - Kit.rand(8, 14), 0); c.lineTo(-8, 4); c.fill();
        }
        c.shadowColor = `hsl(${s.hue} 100% 60%)`; c.shadowBlur = 12;
        c.fillStyle = `hsl(${s.hue} 90% 60%)`;
        c.beginPath(); c.moveTo(12, 0); c.lineTo(-9, -8); c.lineTo(-5, 0); c.lineTo(-9, 8); c.closePath(); c.fill();
        c.restore();
        Kit.text(c, s.human ? `P${k + 1}` : 'CPU', s.x, s.y - 18, 9, s.human ? '#efe9ff' : '#7d73a6');
      });

      Kit.text(c, fmt(clock), W / 2, 225, 18, 'rgba(255,255,255,.35)');
      if (countdown > 0) Kit.text(c, String(Math.ceil(countdown)), W / 2, 190, 48, '#ffd23f');
      else if (clock < 0.8) Kit.text(c, 'GO!', W / 2, 190, 48, '#34e1d6');
      const lap = Math.min(LAPS, Math.max(1, Math.floor(ships[0].prog / N) + 1));
      Kit.text(c, `LAP ${lap}/${LAPS}`, W / 2, 255, 12, '#a99fd0');
    },
  });
})();
</script>
</body>
</html>
